    <title>CodersDive — Engineering for the Ambitious</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Social/OG + canonical tags are managed per-route by react-helmet-async
         (see src/components/Seo.tsx) so every page has unique, correct previews.
         Static fallbacks below cover non-JS crawlers; hosting injects an
         og:image at serve time when a route provides none. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodersDive" />
    <meta property="og:title" content="CodersDive — Engineering for the Ambitious">
    <meta property="og:description" content="CodersDive is the elite product engineering studio for ambitious teams. We design, build and ship category-defining software — fast.">
    <meta property="og:image" content="https://code-depth-showcase.lovable.app/og/default.jpg">
    <meta name="twitter:card" content="summary_large_image" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CodersDive",
        "url": "https://code-depth-showcase.lovable.app",
        "logo": "https://code-depth-showcase.lovable.app/favicon.png",
        "description": "CodersDive is the elite product engineering studio for ambitious teams. We design, build and ship category-defining software."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CodersDive",
        "url": "https://code-depth-showcase.lovable.app"
      }
    </script>
</head>
